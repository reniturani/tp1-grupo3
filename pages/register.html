<!DOCTYPE html>
<html lang="es" class="page-registro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Registro</title>
</head>
<body class="page-registro">
    <header>
        <nav id="nav-registro">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./servicios.html">Servicios</a></li>
                <li><a href="./equipo.html">Equipo</a></li>
                <li><a href="./pedido.html">Pedidos</a></li>
                <li><a href="./faq.html">Faq</a></li>
                <li><a href="./login.html">Iniciar sesión</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-registro">
        <div class="tarjeta-registro">
            <section id="seccion-registro" class="seccion-registro">
                <h1>Formulario de registro</h1>
            </section>

            <form id="formulario-registro" class="formulario-registro">
            <div class="campo-formulario">
                <label class="etiqueta-registro" for="nombre">Nombre:</label>
                <input class="input-registro" type="text" id="nombre" name="nombre" placeholder="Ej: Juan" required>
            </div>

            <div class="campo-formulario">
                <label class="etiqueta-registro" for="apellido">Apellido:</label>
                <input class="input-registro" type="text" id="apellido" name="apellido" placeholder="Ej: Martinez" required>
            </div>

            <div class="campo-formulario">
                <label class="etiqueta-registro" for="email">Email:</label>
                <input class="input-registro" type="email" name="email" id="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="campo-formulario">
                <label class="etiqueta-registro" for="password">Password:</label>
                <input class="input-registro" type="password" name="password" id="password" placeholder="Contraseña" required>
            </div>

            <div class="botones-formulario">
                <button type="reset">Limpiar</button>
                <button type="submit">Registrarse</button>
            </div>

            <div id="mensaje" class="mensaje"></div>
        </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Todos los derechos reservados.</p>
    </footer>

    <script src="../js/register.js"></script>
</body>
</html>
