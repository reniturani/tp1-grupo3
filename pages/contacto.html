<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Contacto</title>
</head>
<body>
    <header>
        <nav class="nav" id="nav-contacto">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./servicios.html">Servicios</a></li>
                <li><a href="./equipo.html">Equipo</a></li>
                <li><a href="./pedido.html">Pedidos</a></li>
                <li><a href="./faq.html">Faq</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="contacto" class="section-contacto">
            <h1>Formulario de contacto</h1>
        </section>

        <form action="https://httpbin.org/post" method="POST" target="_blank">

            <div class="campo-formulario">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan" required>
            </div>

            <div class="campo-formulario">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" placeholder="Ej: Martinez" required> 
            </div>

            <div class="campo-formulario">
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="campo-formulario">
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu consulta aquí..." maxlength="1500" required></textarea>
            </div>

            <div class="botones-formulario">
                <button type="reset">Resetear</button>
                <button type="submit">Enviar</button>
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Todos los derechos reservados.</p>
    </footer>

</body>
</html>
