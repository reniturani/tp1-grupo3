<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEDIDOS DE SERVICIOS</title>
</head>
<body>
    <h1>Selección de servicio</h1>

    <form action="#">
        <div class="grupo_servicios">
            <input type="checkbox" id="servicio1" name="servicios[]" value="limpieza">
            <label for = "servicio1">
                Limpieza interna y mantenimiento
            </label>
        </div>

        <div class="grupo_servicios">
            <input type="checkbox" id="servicio2" name="servicios[]" value="componentes">
            <label for = "servicio2">
                Cambio de componentes y armado de pc
            </label>
        </div>
        <div class="grupo_servicios">
            <input type="checkbox" id="servicio3" name="servicios[]" value="instalacion">
            <label for = "servicio3">
                Instalación de software y SO
            </label>
        </div>
        <div class="grupo_servicios">
            <input type="checkbox" id="servicio4" name="servicios[]" value="diagnostico">
            <label for = "servicio4">
                Diagnostico de fallas
            </label>
        </div><br>

        <div class="pago">
            <p>Seleccione el medio de pago: </p>
        </div>

        <div class="pago">
            <input type="radio" id="efectivo" name="pago" value="efectivo" required>
            <label for="efectivo">Efectivo</label>
        </div>
            
        <div class="pago">
            <input type="radio" id="transferencia" name="pago" value="transferencia" required>
            <label for="transferencia">Transferencia</label>
        </div>
        
        <div class="pago">
            <input type="radio" id="debito" name="pago" value="debito" required>
            <label for="debito">Tarjeta de débito</label>
        </div><br>

        <div class="fecha">
            <label for="fecha_pedido">Fecha en la que realizó el pedido</label><br>
            <input type="date" id="fecha_pedido" name="fecha_pedido" required>
        </div><br>
        
        <div class = "botones">
            <button type="submit">Enviar pedido</button>
            <button type="reset">Cancelar pedido</button>
        </div>
    </form>
</body>
</html>
